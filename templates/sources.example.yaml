# Sources configuration for live-product-discovery.
# Created during onboarding (/live-product-discovery:ost-setup). Values below are examples.
# Stored in Notion, as one YAML code block in the squad's configuration page ("LiveOST configuration – <squad>"),
# so that scheduled runs can read it. Never keep it only in a local file.
# Never put credentials here: connectors handle authentication.
# One configuration per squad. A PM who follows several squads runs the onboarding once per squad.

squad: "Squad A"   # labels this squad's Notion page, recap section and live view
own_company: "Your company"   # feedback logged under this name or its email domains is resolved to the customer it names, or marked internal

north_star: "Customers make better decisions with their data"   # optional
outcomes:                   # one or more (one per product area for a squad that owns several); [] while the squad has none yet
  - "Reduce the time it takes a customer to build their first report"
# To change course later (add, replace or retire an outcome), run /live-product-discovery:ost-change-outcome
# instead of editing these lines: it keeps the history and reviews the tree.
focus: null                 # optional, for a squad with no outcome yet: what the tree is for, shown at the top of the visual tree; never an outcome

scope:
  owns:                     # product areas and features, named as in the product
    - "Report builder"
    - "Report templates"
  out_of_scope:             # neighboring areas owned by other squads
    - "Data connectors"
    - "Billing"
  segments: ["mid-market finance teams"]
  signals:                  # how the scope shows up in the sources
    ticket_tags: ["reports", "templates"]
    call_topics: ["building a report", "report layout"]
    doc_sections: ["Reports", "Templates"]

# Any source can only be read in part? Add to it:
#   coverage: partial       # full by default
#   missing: "what the source cannot reach, and from which date"
# The source then stays partial in the Sources database, and its counts are a floor (see "Reach and age of sources" in ost-rules).
sources:
  calls:
    tool: "call recorder name (e.g. Gong, Modjo)"
    via: connector          # connector | export-folder | script (a command the user runs fills the export folder: add command: "...")
    filter: "calls with customers of the squad's segments"
    keep_contacts: false    # true copies the customer contact (name, email) into the Evidence database; false by default for every source
  tickets:
    tool: "support tool name (e.g. Zendesk, Intercom)"
    via: connector
    filter: "tickets tagged with the squad's product area"
    rank_weight: 1          # weight in the ranking; 0 keeps the evidence attached and visible but out of the ranking
  team_channels:
    tool: "team chat (e.g. Slack, Microsoft Teams)"
    via: connector
    channels: ["#customer-feedback"]   # only these channels are read; never other channels or private messages
    filter: "none at the source: these channels cover the whole product, the scope check filters each message"
  interviews:
    tool: "where the squad writes up its customer interviews (e.g. a Notion database)"
    via: connector
    use: evidence           # one interview note is one item, read like a call; a cloud run can read a Notion database, not a local folder
  insights:
    tool: "insight platform (e.g. a product feedback tool or a research repository)"
    via: connector
    use: evidence           # insights are already extracted: read them, never the conversations behind them
    covers: {calls: some}   # some: both are read and an insight linked to its call is a duplicate of it | all: the call recorder is not read on its own
  ticket_signals:
    tool: "support tool or data warehouse holding ticket categories without their text"
    via: connector
    use: signals            # no customer words: counts per category size the mapped opportunities, never create evidence
    query: "the saved query or call that counts the items per category over the signal window"   # written and tested during onboarding, like the quantitative queries
    mapping:                # confirmed with the user at the quick review: category -> the opportunity's Notion page (a rename does not break it)
      "Export > Formatting": "https://www.notion.so/<opportunity page>"
  quantitative:
    tool: "data warehouse or analytics agent (e.g. MotherDuck, nao, Amplitude)"
    via: connector
    use: sizing-only        # quantitative data never creates opportunities; read only
    # Set up and tested with the user during onboarding (step 2):
    account_key: "how an account is identified in the data (e.g. CRM account ID, company domain)"
    account_level: entity   # entity: a subsidiary or member firm named in the evidence is an account of its own | group: every entity counts as its group. The teams of one company always count as the company
    queries:                # each query is saved as written and tested, and reused by every run
      accounts: "revenue (ARR), segment and plan per account, and the group each account belongs to"   # the revenue of an opportunity is read from here, never from a source's own record
      usage: "usage of the squad's features per account, over time"
      outcome: "the outcome's metric over time"   # leave out while the squad has no outcome
  documentation:
    tool: "help center or product docs"
    via: url                # connector | url (public pages read directly: give the sitemap or the index page) | export-folder | knowledge-base (a documentation base the squad already maintains: read it, never rebuild it)
    url: "https://help.example.com/sitemap.xml"
    use: reference-only     # not customer evidence
    freshness: live         # live: read from the site or the connector at each run | snapshot: a dated copy the squad refreshes
    # With via: knowledge-base, or with freshness: snapshot:
    # location: "the index file or page of the base, or the copy"
    # refresh: "the command or routine that refreshes it; the squad runs it, never the plugin"
    # max_age_days: 35      # past this age the source is partial and the recap says how old the copy is
    # The date of the copy is read from the copy itself at each run: do not write it here.
  release_notes:
    tool: "release notes or product changelog"
    via: url                # same choices as the documentation; often the same base
    url: "https://help.example.com/release-notes"
    use: shipped-features   # which features shipped, and when
    freshness: live
  backlog:
    tool: "issue tracker (e.g. Jira, Linear)"
    via: connector
    filter: "the squad's project, board or labels"   # an item already linked to a solution is read by its link, even outside this filter
    use: delivery           # what the squad delivered and plans; read only, not customer evidence
    status_map:             # agreed during onboarding: what each tracker status means for a linked solution; a status left out changes nothing
      planned: ["To do", "Ready"]
      in delivery: ["In progress", "In review"]
      shipped: ["Done"]     # delivered: the solution is then marked shipped following "Shipped features", never through the map alone

imports:                    # files of customer feedback, mapped with the user during onboarding
  - file: "feedback-export.csv"
    kind: survey            # survey | import
    rank_weight: 1          # weight in the ranking, as for any source
    columns:                # column names in the file; null when the file has none
      verbatim: "Comment"
      date: "Created at"
      account: "Company"
      contact: "Email"
      id: null              # no ID column: a stable ID is built from the file name and the row's content
      link: null

export_folder: null         # folder read when a source uses via: export-folder or via: script; a cloud scheduled task cannot see it

tree:
  workspace: notion
  location: "the page chosen during onboarding"

view:                       # the visual tree, published and refreshed by ost-view
  url: null                 # address of the page; written at the first publication, reused at every refresh
  evidence_recent: 100      # most recent pieces of evidence copied into the page; 0 copies none

schedule:
  runner: cloud             # cloud: runs with the computer off, sees no local file | desktop: sees local folders, only while the app is open | none: no scheduled run (a tree over a fixed period, or a trial of the plugin)
  daily: "working days, early morning"
  weekly: "Monday morning"
  notify: decisions-only    # decisions-only: notify when something waits for the user or the agent changed the tree on its own | every-run

duplicate_window_days: 3    # same account, same need, within this many days, from another source: counted once
signals_window_days: 90     # window of the volumes written from signal sources
unattached_window_weeks: 8  # unattached evidence older than this is no longer grouped into new proposals
batch_tokens: 40000         # text per extraction batch (one or two call transcripts, or fifty tickets)
paused: false               # true while a change of course is being reviewed: the runs skip the squad

kind_weights:               # weight of each kind of evidence in the ranking (see "Kinds of evidence" in ost-rules)
  need: 1
  bug: 1
  question: 1

ranking:                    # see "Ranking" in ost-rules
  age_weights: {last_90_days: 1, up_to_a_year: 0.5, older: 0.25}
  before_release_weight: 0.5
  stability: 0.05           # neighbours whose scores differ by less than 5% of the higher one keep their previous order

freshness:
  addressed_after_weeks: 8  # no evidence this long after a release before proposing "addressed"
  dormant_after_weeks: 24   # no evidence this long before asking whether an opportunity is still current

autonomy: earned            # earned: each type of change is proposed until the squad accepts 4 of its last 5, then made alone when sure
                            # proactive: made alone when sure from the first day | propose-only: every change is a proposal
autonomy_threshold:
  accepted: 4
  of_last: 5
autonomy_per_type: {}       # overrides for one type, e.g. {merge: propose} or {rename: auto}; ost-undo offers to set it
trial_days: 30              # trial batch processed and reviewed first
history: all                # then the full history: "all", a start date (YYYY-MM-DD), or "none"
