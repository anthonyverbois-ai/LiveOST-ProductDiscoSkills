# Sources configuration for live-product-discovery.
# Created during onboarding (/live-product-discovery:ost-setup). Values below are examples.
# Never put credentials here: connectors handle authentication.
# One configuration per squad. A PM who follows several squads runs the onboarding once per squad.

squad: "Squad A"   # labels this squad's Notion page, recap section and live view

north_star: "Customers make better decisions with their data"   # optional
outcome: "Reduce the time it takes a customer to build their first report"
# To change course later, run /live-product-discovery:ost-change-outcome
# instead of editing these two lines: it keeps the history and recalibrates the tree.

scope:
  owns:                     # product areas and features, named as in the product
    - "Report builder"
    - "Report templates"
  out_of_scope:             # neighboring areas owned by other squads
    - "Data connectors"
    - "Billing"
  segments: ["mid-market finance teams"]
  signals:                  # how the scope shows up in the sources
    ticket_tags: ["reports", "templates"]
    call_topics: ["building a report", "report layout"]
    doc_sections: ["Reports", "Templates"]

sources:
  calls:
    tool: "call recorder name (e.g. Gong, Modjo)"
    via: connector          # connector | export-folder
    filter: "calls with customers of the squad's segments"
  tickets:
    tool: "support tool name (e.g. Zendesk, Intercom)"
    via: connector
    filter: "tickets tagged with the squad's product area"
  quantitative:
    tool: "analytics tool name (e.g. Amplitude, Mixpanel)"
    via: connector
    use: sizing-only        # quantitative data never creates opportunities
  documentation:
    tool: "help center or product docs"
    via: connector
    use: reference-only     # not customer evidence
  release_notes:
    tool: "release notes or product changelog"
    via: connector
    use: shipped-features   # which features shipped, and when
  backlog:
    tool: "issue tracker (e.g. Jira, Linear)"
    via: connector
    filter: "the squad's project, board or labels"
    use: delivery           # what the squad delivered and plans; read only, not customer evidence

export_folder: null         # folder read when a source uses via: export-folder

tree:
  workspace: notion
  location: "the page chosen during onboarding"

schedule:
  daily: "working days, early morning"
  weekly: "Monday morning"

mode: observation           # observation for the first two weeks, then normal
trial_days: 30              # trial batch processed and calibrated first
history: all                # then the full history: "all", a start date (YYYY-MM-DD), or "none"
