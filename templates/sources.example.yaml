# Sources configuration for live-product-discovery.
# Created during onboarding (/live-product-discovery:ost-setup). Values below are examples.
# Stored in Notion, as one YAML code block in the squad's configuration page ("LiveOST configuration – <squad>"),
# so that scheduled runs can read it. Never keep it only in a local file.
# Never put credentials here: connectors handle authentication.
# One configuration per squad. A PM who follows several squads runs the onboarding once per squad.

squad: "Squad A"   # labels this squad's Notion page, recap section and live view
own_company: "Your company"   # feedback logged under this name or its email domains is resolved to the customer it names, or marked internal

north_star: "Customers make better decisions with their data"   # optional
outcomes:                   # one or more (one per product area for a squad that owns several); [] while the squad has none yet
  - "Reduce the time it takes a customer to build their first report"
# To change course later (add, replace or retire an outcome), run /live-product-discovery:ost-change-outcome
# instead of editing these lines: it keeps the history and reviews the tree.

scope:
  owns:                     # product areas and features, named as in the product
    - "Report builder"
    - "Report templates"
  out_of_scope:             # neighboring areas owned by other squads
    - "Data connectors"
    - "Billing"
  segments: ["mid-market finance teams"]
  signals:                  # how the scope shows up in the sources
    ticket_tags: ["reports", "templates"]
    call_topics: ["building a report", "report layout"]
    doc_sections: ["Reports", "Templates"]

sources:
  calls:
    tool: "call recorder name (e.g. Gong, Modjo)"
    via: connector          # connector | export-folder
    filter: "calls with customers of the squad's segments"
  tickets:
    tool: "support tool name (e.g. Zendesk, Intercom)"
    via: connector
    filter: "tickets tagged with the squad's product area"
    rank_weight: 1          # weight in the ranking; 0 keeps the evidence attached and visible but out of the ranking
  team_channels:
    tool: "team chat (e.g. Slack, Microsoft Teams)"
    via: connector
    channels: ["#customer-feedback"]   # only these channels are read; never other channels or private messages
    filter: "none at the source: these channels cover the whole product, the scope check filters each message"
  insights:
    tool: "insight platform (e.g. a product feedback tool or a research repository)"
    via: connector
    use: evidence           # insights are already extracted: read them, never the conversations behind them
    covers: ["calls"]       # conversations this platform already reads: they are read here only, not from the call recorder too
  ticket_signals:
    tool: "support tool or data warehouse holding ticket categories without their text"
    via: connector
    use: signals            # no customer words: counts per category size the mapped opportunities, never create evidence
    mapping:                # agreed with the user once the first tree exists: category -> opportunity
      "Export > Formatting": "I lose time reformatting my exports"
  quantitative:
    tool: "data warehouse or analytics agent (e.g. MotherDuck, nao, Amplitude)"
    via: connector
    use: sizing-only        # quantitative data never creates opportunities; read only
    # Set up and tested with the user during onboarding (step 2):
    account_key: "how an account is identified in the data (e.g. CRM account ID, company domain)"
    queries:                # each query is saved as written and tested, and reused by every run
      accounts: "ARR, segment and plan per account"
      usage: "usage of the squad's features per account, over time"
      outcome: "the outcome's metric over time"
  documentation:
    tool: "help center or product docs"
    via: connector
    use: reference-only     # not customer evidence
  release_notes:
    tool: "release notes or product changelog"
    via: connector
    use: shipped-features   # which features shipped, and when
  backlog:
    tool: "issue tracker (e.g. Jira, Linear)"
    via: connector
    filter: "the squad's project, board or labels"
    use: delivery           # what the squad delivered and plans; read only, not customer evidence

imports:                    # files of customer feedback, mapped with the user during onboarding
  - file: "feedback-export.csv"
    kind: survey            # survey | import
    columns:                # column names in the file; null when the file has none
      verbatim: "Comment"
      date: "Created at"
      account: "Company"
      contact: "Email"
      id: null              # no ID column: a stable ID is built from the file name and the row's content
      link: null

export_folder: null         # folder read when a source uses via: export-folder; a cloud scheduled task cannot see it

tree:
  workspace: notion
  location: "the page chosen during onboarding"

schedule:
  runner: cloud             # cloud: runs with the computer off, sees no local file | desktop: sees local folders, only while the app is open
  daily: "working days, early morning"
  weekly: "Monday morning"

duplicate_window_days: 3    # same account, same need, within this many days, from another source: counted once

kind_weights:               # weight of each kind of evidence in the ranking (see "Kinds of evidence" in ost-rules)
  need: 1
  bug: 1
  question: 1

freshness:
  addressed_after_weeks: 8  # no evidence this long after a release before proposing "addressed"
  dormant_after_weeks: 24   # no evidence this long before asking whether an opportunity is still current

autonomy: earned            # earned: each type of change is proposed until the squad accepts 9 of the last 10, then made alone when sure
                            # proactive: made alone when sure from the first day | propose-only: every change is a proposal
autonomy_threshold:
  accepted: 9
  of_last: 10
trial_days: 30              # trial batch processed and reviewed first
history: all                # then the full history: "all", a start date (YYYY-MM-DD), or "none"
