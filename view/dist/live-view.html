 * An opinionated CSS reset that provides a clean, predictable base for
 * Astryx applications. Built on the same principles as Tailwind Preflight

 *
 * This reset:
 * - Normalizes cross-browser inconsistencies
 * - Sets box-sizing: border-box universally
 * - Removes default margins, padding, and list styles
 * - Makes images block-level and responsive

 *
 * 2. Combine with base styles and theme:

 * Consumer styles (unlayered) always override all Astryx layers.
 * The reset has the lowest priority and can be overridden by any other layer.

 * - Tailwind CSS Preflight

@layer reset {

  /* ===========================================================================
     Box Model
     =========================================================================== */

  /*
   * Use border-box globally. Prevents padding/border from affecting
   * element dimensions — the single most impactful reset.
   */
  :where(*), :where(*)::before, :where(*)::after {
    box-sizing: border-box;
  }

  /*
   * Reset borders to 0-width solid. This lets you add a border by just
   * setting border-width — no need to also specify border-style.
   */
  :where(*), :where(*)::before, :where(*)::after {
    border-width: 0;
    border-style: solid;
    border-color: currentColor;
  }

  /* ===========================================================================
     Document
     =========================================================================== */

  /*
   * Consistent line-height, prevent text size adjustment on orientation
   * change in iOS, and set a readable tab size.
   *
   * color-scheme: light dark — declares that this page supports both modes,
   * enabling CSS light-dark() to resolve correctly. Also ensures that CSS
   * tools (e.g. LightningCSS) which polyfill light-dark() for older browsers
   * inject their toggle-variable initialization in the same CSS bundle.
   * XDSTheme overrides color-scheme per-wrapper as needed.
   */

    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    color-scheme: light dark;
  }

  /*
   * Remove default body margin and set font smoothing for sharper text
   * rendering on macOS/iOS.
   */

    margin: 0;
    line-height: inherit;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

  /* ===========================================================================
     Typography
     =========================================================================== */

  /*
   * Reset headings to inherit size and weight. Headings should be styled
   * intentionally — not rely on browser defaults that vary across browsers.

    font-size: inherit;
    font-weight: inherit;

   * rather than relying on browser-default blue/purple.

    color: inherit;
    text-decoration: inherit;

    font-size: 80%;

   * Remove default list styles, margin, and padding. Lists used for
   * navigation or layout shouldn't carry prose styling by default.
   * Use explicit styles for prose lists.

    list-style: none;
    margin: 0;
    padding: 0;

   * below inline images and aligns with how these elements are
   * actually used in modern layouts.

    display: block;
    vertical-align: middle;

   * Constrain images and video to their container. Responsive by default.
   */

    max-width: 100%;
    height: auto;

     =========================================================================== */

   * than using the browser's default font stack.

    font: inherit;
    color: inherit;
    margin: 0;
    padding: 0;

    -webkit-appearance: button;
    appearance: button;
    background-color: transparent;
    background-image: none;

    cursor: pointer;

  /*
   * Disabled elements take back any interactive cursor: a control that will
   * not respond must not answer the pointer as though it will. `default`

   * for Chrome and Safari.

   * Remove default fieldset styles.
   */

    margin: 0;
    padding: 0;
  }

  :where(legend) {
    padding: 0;
  }

  /* ===========================================================================
     Tables
     =========================================================================== */

  /*
   * Collapse table borders and fix text-indent/border-color inheritance.
   */
  :where(table) {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }

  /* ===========================================================================
     Misc
     =========================================================================== */

  /*
   * Simplify hr to a single border-top line.
   */

    height: 0;
    color: inherit;
    border-top-width: 1px;
  }

  /*
   * Correct display for summary elements.
   */
  :where(summary) {
    display: list-item;
  }

  /*
   * Reset dialog padding and outline.
   */
  :where(dialog) {
    padding: 0;
    outline: none;
  }

  /*
   * Ensure hidden elements are actually hidden. `hidden="until-found"` keeps
   * the browser's own rendering, `content-visibility: hidden`, so find in page
   * and text fragment links can still find its content and reveal it.
   */

    display: none;
  }

  /*
   * Remove tap highlight on iOS.
   */
  :where(html) {
    -webkit-tap-highlight-color: transparent;
  }

  /* ===========================================================================
     Color Scheme
     =========================================================================== */

  /*
   * Map data-theme attribute to CSS color-scheme.
   *
   * Setting data-theme on <html> tells the browser which color scheme
   * to use for native UI elements (scrollbars, form controls, date
   * pickers) and enables CSS light-dark() to resolve correctly.
   *
   * XDSTheme auto-detects when it's the root provider and syncs this
   * attribute on the client. For RSC / SSR, set it on <html> in your
   * root layout to avoid a flash of wrong theme:
   *
   *   <html lang="en" data-theme="dark">
   *
   * Values: "light" | "dark" | omitted (defaults to light dark = system)
   */
  :where(html[data-theme="light"]) {
    color-scheme: light;
  }

  :where(html[data-theme="dark"]) {
    color-scheme: dark;
  }

  :where(html:not([data-theme])) {
    color-scheme: light dark;
  }

  /* ===========================================================================
     Media Theme Baseline
     =========================================================================== */

  /*
   * color-scheme flip for [data-*-media] — makes light-dark() base
   * tokens resolve correctly on inverted surfaces without a theme.
   * Token overrides (text/icon/accent) are theme-level (generateOnMediaCSS).
   * Dual-prefix (astryx + legacy xds) during the compat window.
   */

    color-scheme: dark;
  }

  :where([data-astryx-media="light"]) {
    color-scheme: light;
  }

  --lpd-map-rail: var(--color-border-emphasized);
}

/* Light-only by choice: the theme's colors resolve with light-dark(), so the color scheme stays light
   even when the viewer's app is in dark mode. */
html, html[data-theme="dark"], html[data-theme="light"] { color-scheme: light !important; }

body {
  background: var(--color-background-body);
  color: var(--color-text-primary);
  font-family: var(--font-family-body), system-ui, sans-serif;
}

.page {
  max-width: 1200px;
  margin: 0 auto;
  padding-block: var(--spacing-6) var(--spacing-8);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: var(--spacing-5);
}

.head {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-3);
  justify-content: space-between;
  align-items: center;
}
.page-title { margin: 0; font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); }

.recap {
  background: var(--color-background-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-container);
  padding: var(--spacing-4);
}
.recap-title { margin: 0 0 var(--spacing-2); font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); }
.recap-title * { font: inherit; color: inherit; }
.recap ul { margin: 0; padding-left: 1.2em; list-style: disc; display: grid; gap: var(--spacing-1); color: var(--color-text-secondary); }

.tab-body { min-width: 0; }

/* Tree map */
.map { display: flex; flex-direction: column; gap: var(--spacing-5); }
.outcome-node {
  align-self: center;
  max-width: 640px;
  text-align: center;
  padding: var(--spacing-4) var(--spacing-5);
  border-radius: var(--radius-container);
  background: var(--color-accent-muted);
  border: 1px solid var(--color-accent);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1);
}

.branches {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--spacing-4);
  position: relative;
  padding-top: var(--spacing-4);
  border-top: 2px solid var(--lpd-map-rail);
}
.branch { min-width: 0; display: flex; flex-direction: column; gap: var(--spacing-2); position: relative; }
.branch::before {
  content: "";
  position: absolute;
  top: calc(-1 * var(--spacing-4));
  left: var(--spacing-5);
  height: var(--spacing-4);
  border-left: 2px solid var(--lpd-map-rail);
}

.opp { min-width: 0; display: flex; flex-direction: column; gap: var(--spacing-1-5); }
.opp-child { margin-left: var(--spacing-5); padding-left: var(--spacing-3); border-left: 2px solid var(--lpd-map-rail); }
/* Addressed and set-aside opportunities stay readable but step back. */
.opp-dim .opp-card { background: var(--color-background-muted); }
.opp-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
  padding: var(--spacing-3);
  border-radius: var(--radius-element);
  background: var(--color-background-card);
  border: 1px solid var(--color-border);
  color: var(--color-text-primary);
}
.opp-head { display: flex; gap: var(--spacing-2); align-items: baseline; min-width: 0; }
.opp-num {
  flex: none;
  font-variant-numeric: tabular-nums;
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-bold, 700);
  line-height: 1.2;
  color: var(--color-text-primary);
}
.opp-num-child { font-size: var(--font-size-base); color: var(--color-text-secondary); }
.opp-status { font-size: var(--font-size-sm); color: var(--color-text-secondary); }

/* Links to Notion: the title itself is the link, with a small external-link icon. */
.notion-link { color: inherit; text-decoration: none; display: inline; }
.notion-link > :last-child { margin-left: 4px; vertical-align: -1px; opacity: 0.7; }
.notion-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.notion-link:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 2px; }
.opp-name { font-weight: var(--font-weight-medium); line-height: 1.35; }
.outcome-text { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); text-wrap: balance; }
.drawer-notion { font-weight: var(--font-weight-medium); color: var(--color-text-blue); align-self: flex-start; }

/* Evidence and accounts: below the title in size, numbers in bold; the whole row opens the verbatims. */
.opp-stats {
  all: unset;
  box-sizing: border-box;
  cursor: pointer;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--spacing-1) var(--spacing-3);
  margin: 0 calc(-1 * var(--spacing-1-5));
  padding: var(--spacing-1) var(--spacing-1-5);
  border-radius: var(--radius-element);
}
.opp-stats:hover { background: var(--color-background-muted); }
.opp-stats:hover .see-ev { text-decoration: underline; text-underline-offset: 3px; }
.opp-stats:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.stat { display: inline-flex; align-items: baseline; gap: 4px; }
.stat-n { font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; }
.stat-l { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
.see-ev { margin-left: auto; font-size: var(--font-size-sm); color: var(--color-text-blue); }
.signal { font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
.opp-last { font-size: var(--font-size-sm); color: var(--color-text-secondary); }

/* Solutions: a foldable level under each opportunity. */
.sol-block { margin-left: var(--spacing-3); font-size: var(--font-size-sm); }
.sol-trigger { font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); color: var(--color-text-secondary); }
.sol-tree {
  list-style: none;
  margin: var(--spacing-1) 0 0;
  padding: 0 0 0 var(--spacing-3);
  border-left: 2px solid var(--lpd-map-rail);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
}
.sol-tree li { display: flex; flex-wrap: wrap; gap: var(--spacing-1) var(--spacing-2); align-items: baseline; }
.sol-name { font-weight: var(--font-weight-medium); }
.sol-status { color: var(--color-text-secondary); font-size: var(--font-size-sm); }
.sol-assumption { flex-basis: 100%; color: var(--color-text-secondary); font-size: var(--font-size-sm); }

.map-tools { display: flex; flex-wrap: wrap; gap: var(--spacing-3); align-items: center; justify-content: space-between; }
.map-legend { margin: 0; font-size: var(--font-size-sm); color: var(--color-text-secondary); }
.map-tools .map-legend { flex: 1 1 320px; }

/* Candidates and set-aside opportunities, below the tree. */
.aside { display: flex; flex-direction: column; gap: var(--spacing-2); padding-top: var(--spacing-4); border-top: 1px dashed var(--color-border); }
.aside-title { margin: 0; font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); }
.aside-note { margin: 0; max-width: 720px; font-size: var(--font-size-sm); color: var(--color-text-secondary); }
.aside-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--spacing-4); padding-top: var(--spacing-1); }

.outline { display: flex; flex-direction: column; gap: var(--spacing-3); max-width: 860px; }

/* Pending decisions */
.pending { display: grid; gap: var(--spacing-4); max-width: 760px; }
.panel {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-container);
  padding: var(--spacing-4);
  background: var(--color-background-card);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
}
.panel-title { margin: 0; font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); }
.panel-text { margin: 0; color: var(--color-text-secondary); }
.actions { display: flex; flex-wrap: wrap; gap: var(--spacing-2); }
.decided { margin: 0; display: flex; flex-wrap: wrap; gap: var(--spacing-2); align-items: center; color: var(--color-text-secondary); font-size: var(--font-size-sm); }

/* Changelog */
.changelog { list-style: none; margin: 0; padding: 0; max-width: 860px; }
.changelog li {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr) auto;
  gap: var(--spacing-3);
  align-items: baseline;
  padding: var(--spacing-2-5, 10px) 0;
  border-bottom: 1px solid var(--color-border);
}
.cl-by { color: var(--color-text-secondary); font-size: var(--font-size-sm); }
.cl-date { color: var(--color-text-secondary); font-variant-numeric: tabular-nums; font-size: var(--font-size-sm); }

/* Drawer */
.drawer-body { display: flex; flex-direction: column; gap: var(--spacing-4); }
.drawer-h { margin: 0; font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); }
.note { margin: 0; padding: var(--spacing-3); border-radius: var(--radius-element); background: var(--color-background-purple); color: var(--color-text-purple); }
.evidence { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--spacing-3); }
.evidence li { padding-bottom: var(--spacing-3); border-bottom: 1px solid var(--color-border); display: flex; flex-direction: column; gap: var(--spacing-1-5); }
.evidence blockquote { margin: 0; font-size: var(--font-size-base); line-height: 1.5; }
.ev-meta { display: flex; flex-wrap: wrap; gap: var(--spacing-2); align-items: center; color: var(--color-text-secondary); font-size: var(--font-size-sm); }
.ev-why { margin: 0; color: var(--color-text-secondary); font-size: var(--font-size-sm); }

/* Footer: secondary information */
.foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-2) var(--spacing-5);
  align-items: center;
  padding-top: var(--spacing-3);
  border-top: 1px solid var(--color-border);
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
}
.foot-item { display: inline-flex; flex-wrap: wrap; gap: var(--spacing-1-5); align-items: center; }
.foot-sources { gap: var(--spacing-3); }
.source { display: inline-flex; gap: var(--spacing-1); align-items: center; }
.foot a { color: var(--color-text-accent); }

@media (max-width: 520px) {
  .changelog li { grid-template-columns: minmax(0, 1fr) auto; }
  .cl-by { color: var(--color-text-secondary); font-size: var(--font-size-sm); }
.cl-date { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
