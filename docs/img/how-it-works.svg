<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Every morning, LiveOST reads what customers said, links each piece of evidence to the right opportunity and each backlog item to the solution it delivers, sends a short recap, and keeps the Opportunity Solution Tree up to date. Fictional example.</title>
  <style>
    .h { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #57606a; }
    .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .b { font-size: 13px; fill: #1f2328; }
    .g { font-size: 12.5px; fill: #57606a; }
    .q { font-size: 13px; font-style: italic; fill: #1f2328; }
    .lvl { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: #8c959f; }
    .opp { font-size: 13.5px; font-weight: 600; fill: #1f2328; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .well { fill: #f6f8fa; }
    .line { fill: none; stroke: #8c959f; stroke-width: 1.5; }
  </style>

  <rect width="1280" height="700" rx="16" fill="#ffffff"/>

  <!-- Left: every morning -->
  <rect x="16" y="16" width="420" height="668" rx="12" fill="#f6f8fa"/>
  <text x="40" y="56" class="h">Every morning</text>
  <text x="40" y="80" class="sub">The agent runs on its own</text>

  <!-- Step 1 -->
  <rect x="40" y="100" width="372" height="126" rx="10" class="card"/>
  <circle cx="62" cy="126" r="11" fill="#1f2328"/>
  <text x="62" y="130.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="82" y="131" class="t">Reads what is new</text>
  <g text-anchor="middle">
    <rect x="56" y="144" width="64" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <g transform="translate(88 162)" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M-5.5 -8 L-2.5 -8 L-1 -4 L-3 -2.5 C-2 0 0 2 2.5 3 L4 1 L8 2.5 L8 5.5 C8 7 6.5 8 5 8 C-2 7.5 -7.5 2 -8 -5 C-8 -6.5 -7 -8 -5.5 -8 Z"/></g>
    <text x="88" y="186" font-size="11.5" fill="#1f2328">Calls</text>
    <rect x="126" y="144" width="64" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <g transform="translate(158 162)" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M-9 -6 H9 V-2 A2 2 0 0 0 9 2 V6 H-9 V2 A2 2 0 0 0 -9 -2 Z"/><path d="M3 -6 V6" stroke-dasharray="2 2"/></g>
    <text x="158" y="186" font-size="11.5" fill="#1f2328">Tickets</text>
    <rect x="196" y="144" width="64" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <g transform="translate(228 162)" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M-8 -7 H8 A2 2 0 0 1 10 -5 V3 A2 2 0 0 1 8 5 H-1 L-5 8.5 V5 H-8 A2 2 0 0 1 -10 3 V-5 A2 2 0 0 1 -8 -7 Z"/><path d="M-5 -2 H5 M-5 1.5 H2"/></g>
    <text x="228" y="186" font-size="11.5" fill="#1f2328">Team chat</text>
    <rect x="266" y="144" width="64" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <g transform="translate(298 162)" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M-6 -9 H3 L7 -5 V9 H-6 Z"/><path d="M3 -9 V-5 H7 M-3 -1 H4 M-3 2.5 H4 M-3 6 H1"/></g>
    <text x="298" y="186" font-size="11.5" fill="#1f2328">Docs</text>
    <rect x="336" y="144" width="64" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <g transform="translate(368 162)" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M-9 -7 h4 v4 h-4 Z M-9 -1 h4 v4 h-4 Z M-9 5 h4 v4 h-4 Z" /><path d="M-2 -5 H9 M-2 1 H9 M-2 7 H6"/><path d="M-8.2 -5 L-7.2 -4 L-5.6 -6.2" /></g>
    <text x="368" y="186" font-size="11.5" fill="#1f2328">Backlog</text>
  </g>
  <text x="56" y="212" class="g">3 calls · 7 tickets · 2 messages since yesterday</text>

  <path d="M226 230 v14" class="line"/><path d="M220 240 l6 7 l6 -7" class="line"/>

  <!-- Step 2 -->
  <rect x="40" y="252" width="372" height="172" rx="10" class="card"/>
  <circle cx="62" cy="278" r="11" fill="#1f2328"/>
  <text x="62" y="282.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="82" y="283" class="t">Maps everything onto the tree</text>
  <rect x="56" y="298" width="340" height="46" rx="6" class="well"/>
  <text x="68" y="317" class="q">“I rebuild the same export every Monday.”</text>
  <text x="68" y="335" class="g">Account A · call</text>
  <text x="56" y="364" class="b"><tspan fill="#1a7f37" font-weight="700">→</tspan> opportunity “I lose time reformatting…”</text>
  <rect x="56" y="378" width="72" height="22" rx="11" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="92" y="393.5" text-anchor="middle" font-size="12" font-weight="700" fill="#7d4e00">REP-142</text>
  <text x="136" y="394" class="b"><tspan fill="#1a7f37" font-weight="700">→</tspan> solution “Paste charts as images”</text>
  <text x="56" y="414" class="g">Backlog item in delivery</text>

  <path d="M226 428 v14" class="line"/><path d="M220 438 l6 7 l6 -7" class="line"/>

  <!-- Step 3 -->
  <rect x="40" y="450" width="372" height="170" rx="10" class="card"/>
  <circle cx="62" cy="476" r="11" fill="#1f2328"/>
  <text x="62" y="480.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="82" y="481" class="t">Sends a short recap</text>
  <rect x="56" y="496" width="340" height="110" rx="6" class="well"/>
  <g class="b">
    <text x="68" y="519">• 12 pieces of evidence attached</text>
    <text x="68" y="542">• Trending: “I lose time reformatting…”</text>
    <text x="68" y="565">• Created: “I’m not sure my numbers…”</text>
    <text x="68" y="588">• To decide: merge two similar needs</text>
  </g>

  <text x="40" y="656" class="g">The squad decides and corrects in Notion,</text>
  <text x="40" y="674" class="g">or asks Claude to undo; the agent learns from it.</text>

  <!-- Arrow between panels -->
  <path d="M448 316 L472 330 L448 344 Z" fill="#8c959f"/>

  <!-- Right: the tree -->
  <text x="500" y="56" class="h">Your Opportunity Solution Tree, always up to date</text>
  <text x="500" y="80" class="sub">Teresa Torres’ framework, fed every day by real customer evidence</text>

  <text x="500" y="139" class="lvl">OUTCOME</text>
  <text x="500" y="256" class="lvl">OPPORTUNITIES</text>
  <text x="500" y="387" class="lvl">SUB-OPPORTUNITIES</text>
  <text x="500" y="502" class="lvl">SOLUTIONS</text>

  <!-- connectors -->
  <path d="M940 166 V186 M745 186 H1135 M745 186 V206 M940 186 V206 M1135 186 V206" class="line"/>
  <path d="M745 298 V348 M940 298 V348 M745 426 V474 M940 426 V474" class="line"/>

  <!-- Outcome -->
  <rect x="720" y="104" width="440" height="62" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="940" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Reduce the time to build a first report</text>
  <text x="940" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">from 3 days to 1 day</text>

  <!-- Opportunities -->
  <g text-anchor="middle">
    <rect x="655" y="206" width="180" height="92" rx="10" class="card"/>
    <text x="745" y="231" class="opp">I don’t know where to</text>
    <text x="745" y="249" class="opp">start building a report</text>
    <text x="745" y="280" class="g">11 customer accounts</text>

    <rect x="850" y="206" width="180" height="92" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="940" y="231" class="opp">I lose time reformatting</text>
    <text x="940" y="249" class="opp">my exports</text>
    <text x="940" y="280" class="g">7 customer accounts</text>
    <rect x="962" y="194" width="68" height="22" rx="11" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="996" y="209.5" font-size="12" font-weight="700" fill="#1a7f37">+4 today</text>

    <rect x="1045" y="206" width="180" height="92" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <text x="1135" y="231" class="opp">I’m not sure my numbers</text>
    <text x="1135" y="249" class="opp">are up to date</text>
    <text x="1135" y="280" class="g">2 customer accounts</text>
    <rect x="1179" y="194" width="46" height="22" rx="11" fill="#ddf4ff" stroke="#0969da"/>
    <text x="1202" y="209.5" font-size="12" font-weight="700" fill="#0969da">New</text>

    <!-- Sub-opportunities -->
    <rect x="655" y="348" width="180" height="78" rx="10" class="card"/>
    <text x="745" y="371" class="opp">I can’t find the right</text>
    <text x="745" y="389" class="opp">template for my use case</text>
    <text x="745" y="413" class="g">8 customer accounts</text>

    <rect x="850" y="348" width="180" height="78" rx="10" class="card"/>
    <text x="940" y="371" class="opp">Charts break when I</text>
    <text x="940" y="389" class="opp">paste them elsewhere</text>
    <text x="940" y="413" class="g">4 customer accounts</text>

    <!-- Solutions -->
    <rect x="655" y="474" width="180" height="56" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="745" y="498" class="opp">Template gallery</text>
    <text x="745" y="517" class="g">In discovery</text>

    <rect x="850" y="474" width="180" height="56" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="940" y="498" class="opp">Paste charts as images</text>
    <text x="940" y="517" class="g"><tspan font-weight="700" fill="#7d4e00">REP-142</tspan> · in delivery</text>
  </g>

  <!-- Legend -->
  <rect x="500" y="572" width="68" height="22" rx="11" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="534" y="587.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f37">+4 today</text>
  <text x="578" y="588" class="g">gained evidence since yesterday</text>
  <rect x="800" y="572" width="46" height="22" rx="11" fill="#ddf4ff" stroke="#0969da"/>
  <text x="823" y="587.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">New</text>
  <text x="856" y="588" class="g">created by the agent from a clear need</text>
  <rect x="500" y="606" width="72" height="22" rx="11" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="536" y="621.5" text-anchor="middle" font-size="12" font-weight="700" fill="#7d4e00">REP-142</text>
  <text x="582" y="622" class="g">backlog item linked to its solution; the delivery status follows the tracker</text>
  <text x="500" y="664" class="g">Every count opens the customer verbatims behind it. Fictional example.</text>
</svg>
